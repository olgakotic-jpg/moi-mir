<header><h1 id="home">🌸 Мой мир</h1><span class="crumb" id="crumb"></span><span id="syncBadge" style="display:none;cursor:pointer;margin-left:auto;font-size:15px" data-act="goData"></span><nav id="nav"></nav></header>
<div id="banner" style="max-width:980px;margin:12px auto 0;padding:0 16px"></div>
<main id="app"></main>
<dialog id="dlg"></dialog>
<dialog id="qdlg" class="sheet"></dialog>
<button id="fab" aria-label="Что записать?" title="Быстро записать: расход, задачу, событие">✎</button>
<div id="toast"></div>

<script>
'use strict';
/* ================= общие утилиты ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const pad = n => String(n).padStart(2, '0');
const MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const toast = t => { const e = $('#toast'); e.textContent = t; e.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('show'), 2600); };
const todayD = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const dayDiff = (a, b) => Math.round((b - a) / 864e5);
const plural = (n, a, b, c) => { const m = n % 100, k = n % 10; return m > 10 && m < 15 ? c : k === 1 ? a : k > 1 && k < 5 ? b : c; };
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const dRu = ds => String(ds).split('-').reverse().join('.');

/* ================= хранение (общее для всех разделов) ================= */
const LS = 'moi_mir_v1';
function seed() {
  const H = (name, d, m, who = '', rule = '') => ({id: uid(), name, d, m, rule, on: true, who, custom: false});
  return {
    v: 1, lastBackup: null,
    people: [], tasks: [], rules: [], log: {}, trips: [], packTpl: null, recipes: [], menu: {}, shop: [], events: [],
    holidays: [
      H('Новый год', 1, 1), H('Рождество', 7, 1), H('День защитника Отечества', 23, 2), H('Международный женский день', 8, 3),
      H('Праздник Весны и Труда', 1, 5), H('День Победы', 9, 5), H('День России', 12, 6), H('День семьи, любви и верности', 8, 7),
      H('День знаний', 1, 9), H('День учителя', 5, 10), H('День народного единства', 4, 11), H('День матери', 0, 11, '', 'lastSunNov'),
    ].map(h => Object.assign(h, ['Рождество', 'День России', 'День знаний', 'День народного единства', 'День учителя', 'День семьи, любви и верности', 'Праздник Весны и Труда'].includes(h.name) ? {on: false} : {})),
    done: {},
  };
}
let D;
try { D = JSON.parse(localStorage.getItem(LS)); } catch (e) { D = null; }
if (!D || !D.people) D = seed();
if (!D.tasks) D.tasks = [];
if (!D.rules) D.rules = [];
if (!D.log) D.log = {};
if (!D.trips) D.trips = [];
if (!D.recipes) D.recipes = [];
if (!D.menu) D.menu = {};
if (!D.shop) D.shop = [];
if (!D.events) D.events = [];
/* --- память об удалённом: id удалённых записей хранятся в D.tomb, чтобы при объединении данных они не возвращались --- */
function idList(o, out) {
  if (Array.isArray(o)) { if (o.length && o.every(x => x && typeof x === 'object' && x.id)) o.forEach(x => out.add(x.id)); o.forEach(x => idList(x, out)); }
  else if (o && typeof o === 'object') for (const k in o) if (k !== 'tomb') idList(o[k], out);
  return out;
}
function pruneTomb(o, t) {
  if (Array.isArray(o)) { for (let i = o.length - 1; i >= 0; i--) { const x = o[i]; if (x && typeof x === 'object' && x.id && t[x.id]) o.splice(i, 1); else pruneTomb(x, t); } }
  else if (o && typeof o === 'object') for (const k in o) if (k !== 'tomb') pruneTomb(o[k], t);
}
let knownIds = idList(D, new Set());
function trackDeletes() {
  const cur = idList(D, new Set()), now = Date.now();
  knownIds.forEach(id => { if (!cur.has(id)) (D.tomb = D.tomb || {})[id] = now; });

const bgFound = {};
function setBg(url) {

/* ---- календарь (.ics) ---- */
function icsFold(l) { const o = []; while (l.length > 70) { o.push(l.slice(0, 70)); l = ' ' + l.slice(70); } o.push(l); return o.join('\r\n'); }
const icsEsc = s => String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
function buildIcs(days, withTasks = true, withRules = true, withTrips = true, withEvents = true, withHealth = true) {
  const t = todayD(), L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Мой мир//RU', 'CALSCALE:GREGORIAN', 'X-WR-CALNAME:Мой мир'];
  const RR = {daily: 'FREQ=DAILY', weekly: 'FREQ=WEEKLY', monthly: 'FREQ=MONTHLY', yearly: 'FREQ=YEARLY'};
  const addTask = k => {
    const ds = x => `${x.getFullYear()}${pad(x.getMonth() + 1)}${pad(x.getDate())}`, due = pd(k.due);
    L.push('BEGIN:VEVENT', `UID:${k.id}@moi-mir`, `DTSTAMP:${ds(t)}T000000Z`);
    let trigger, extraAlarm = false;
    if (k.time) { // дело со временем: событие на час, напоминание за 30 минут
      const [hh, mm] = k.time.split(':').map(Number), st = new Date(due.getFullYear(), due.getMonth(), due.getDate(), hh, mm), en = new Date(st.getTime() + 36e5);
      const dt = x => `${ds(x)}T${pad(x.getHours())}${pad(x.getMinutes())}00`;
      L.push(`DTSTART:${dt(st)}`, `DTEND:${dt(en)}`); trigger = 'TRIGGER:-PT30M';
    } else { // дело на весь день: напоминание в 9:00
      const en = pd(k.until || k.due); en.setDate(en.getDate() + 1);
      L.push(`DTSTART;VALUE=DATE:${ds(due)}`, `DTEND;VALUE=DATE:${ds(en)}`); trigger = 'TRIGGER:PT9H';
      if (k.until && k.until > k.due) extraAlarm = true; // период: второе напоминание в 9:00 в последний день
    }
    if (k.repeat && RR[k.repeat]) L.push('RRULE:' + RR[k.repeat]);
    L.push(icsFold('SUMMARY:' + icsEsc('✅ ' + k.title + (k.prio ? ' ⭐' : ''))));
    const desc = [k.list && 'Список: ' + k.list, k.note].filter(Boolean).join('\n'); if (desc) L.push(icsFold('DESCRIPTION:' + icsEsc(desc)));
    L.push('BEGIN:VALARM', 'ACTION:DISPLAY', icsFold('DESCRIPTION:' + icsEsc(k.title)), trigger, 'END:VALARM');
    if (extraAlarm) L.push('BEGIN:VALARM', 'ACTION:DISPLAY', icsFold('DESCRIPTION:' + icsEsc('Последний день: ' + k.title)), 'TRIGGER;RELATED=END:-PT15H', 'END:VALARM');
    L.push('END:VEVENT');
  };
  const add = (title, e, desc) => {
    const o = nextOcc(e, t).date, end = new Date(o); end.setDate(end.getDate() + 1);
    const ds = x => `${x.getFullYear()}${pad(x.getMonth() + 1)}${pad(x.getDate())}`;
    const hrs = days * 24 - 9, trigger = hrs >= 0 ? `TRIGGER:-PT${hrs}H` : `TRIGGER:PT${-hrs}H`; // напоминание в 9:00 за N дней
    L.push('BEGIN:VEVENT', `UID:${e.id}@moi-mir`, `DTSTAMP:${ds(t)}T000000Z`, `DTSTART;VALUE=DATE:${ds(o)}`, `DTEND;VALUE=DATE:${ds(end)}`);
    if (!e.rule) L.push('RRULE:FREQ=YEARLY'); else L.push('RRULE:FREQ=YEARLY;BYMONTH=11;BYDAY=-1SU');
    L.push(icsFold('SUMMARY:' + icsEsc(title)));
    if (desc) L.push(icsFold('DESCRIPTION:' + icsEsc(desc)));
    L.push('TRANSP:TRANSPARENT', 'BEGIN:VALARM', 'ACTION:DISPLAY', icsFold('DESCRIPTION:' + icsEsc(title)), trigger, 'END:VALARM', 'END:VEVENT');
  };
  D.people.filter(p => p.d && p.m).forEach(p => add('🎂 День рождения: ' + p.name, p,[p.gifts && 'Идеи подарка: ' + p.gifts, p.note].filter(Boolean).join('\n')));
  D.holidays.filter(h => h.on).forEach(h => add('🎉 ' + h.name, h, holWho(h) ? 'Поздравить: ' + holWho(h) : ''));
  if (withTasks) D.tasks.filter(k => !k.done && k.due && (k.until || k.due) >= iso(t)).forEach(addTask);
  if (withTrips) D.trips.filter(tr => tr.start && (tr.end || tr.start) >= iso(t)).forEach(tr => {
    const ds = x => `${x.getFullYear()}${pad(x.getMonth() + 1)}${pad(x.getDate())}`, en = pd(tr.end || tr.start); en.setDate(en.getDate() + 1);
    L.push('BEGIN:VEVENT', `UID:${tr.id}@moi-mir`, `DTSTAMP:${ds(t)}T000000Z`, `DTSTART;VALUE=DATE:${ds(pd(tr.start))}`, `DTEND;VALUE=DATE:${ds(en)}`,
      icsFold('SUMMARY:' + icsEsc('🏖️ ' + tr.title + (tr.place ? ' (' + tr.place + ')' : ''))));
    if (tr.note) L.push(icsFold('DESCRIPTION:' + icsEsc(tr.note)));
    L.push('BEGIN:VALARM', 'ACTION:DISPLAY', icsFold('DESCRIPTION:' + icsEsc('Через неделю: ' + tr.title)), 'TRIGGER:-PT159H', 'END:VALARM', 'END:VEVENT');
    (tr.bookings || []).filter(b => !b.done && b.date && b.date >= iso(t)).forEach(b => { // сроки броней и оплат
      const e2 = pd(b.date); e2.setDate(e2.getDate() + 1);
      L.push('BEGIN:VEVENT', `UID:${b.id}@moi-mir`, `DTSTAMP:${ds(t)}T000000Z`, `DTSTART;VALUE=DATE:${ds(pd(b.date))}`, `DTEND;VALUE=DATE:${ds(e2)}`,
        icsFold('SUMMARY:' + icsEsc(`🎫 ${b.type}: ${b.title} (${tr.title})`)), 'BEGIN:VALARM', 'ACTION:DISPLAY', icsFold('DESCRIPTION:' + icsEsc(b.title)), 'TRIGGER:PT9H', 'END:VALARM',
        'BEGIN:VALARM', 'ACTION:DISPLAY', icsFold('DESCRIPTION:' + icsEsc('Через 2 дня: ' + b.title)), 'TRIGGER:-PT39H', 'END:VALARM', 'END:VEVENT');
    });
  });
  // визиты к врачу и обследования (в закрытом паролем виде не выгружаем)
  if (withHealth && !isLocked()) D.health.visits.concat(D.health.exams).filter(r => r.date >= iso(t) && r.status !== 'cancelled' && (r.status || 'planned') === 'planned').forEach(r => {
    const ds = x => `${x.getFullYear()}${pad(x.getMonth() + 1)}${pad(x.getDate())}`, st = pd(r.date);
    L.push('BEGIN:VEVENT', `UID:${r.id}@moi-mir`, `DTSTAMP:${ds(t)}T000000Z`);
    if (r.time) { const [hh, mm] = r.time.split(':').map(Number), a = new Date(st.getFullYear(), st.getMonth(), st.getDate(), hh, mm), b = new Date(a.getTime() + 36e5), f = x => `${ds(x)}T${pad(x.getHours())}${pad(x.getMinutes())}00`; L.push(`DTSTART:${f(a)}`, `DTEND:${f(b)}`); }
    else { const en = pd(r.date); en.setDate(en.getDate() + 1); L.push(`DTSTART;VALUE=DATE:${ds(st)}`, `DTEND;VALUE=DATE:${ds(en)}`); }
    L.push(icsFold('SUMMARY:' + icsEsc('🩺 ' + r.title + (r.who ? ' (' + r.who + ')' : ''))));
    const desc = [r.place, r.reason].filter(Boolean).join('\n'); if (desc) L.push(icsFold('DESCRIPTION:' + icsEsc(desc)));
    L.push('BEGIN:VALARM', 'ACTION:DISPLAY', icsFold('DESCRIPTION:' + icsEsc('Завтра: ' + r.title)), r.time ? 'TRIGGER:-P1D' : 'TRIGGER:-PT15H', 'END:VALARM',
      'BEGIN:VALARM', 'ACTION:DISPLAY', icsFold('DESCRIPTION:' + icsEsc(r.title)), r.time ? 'TRIGGER:-PT1H' : 'TRIGGER:PT9H', 'END:VALARM', 'END:VEVENT');
  });
  // свои события календаря (загруженные из Google не возвращаем обратно, чтобы не задваивать)
  if (withEvents) D.events.filter(e => e.src === 'own' && ((e.repeat && (!e.until || e.until >= iso(t))) || (e.end || e.date) >= iso(t))).forEach(e => {
    const ds = x => `${x.getFullYear()}${pad(x.getMonth() + 1)}${pad(x.getDate())}`, st = pd(e.date);
    L.push('BEGIN:VEVENT', `UID:${e.id}@moi-mir`, `DTSTAMP:${ds(t)}T000000Z`);
    if (e.time) { const [hh, mm] = e.time.split(':').map(Number), a = new Date(st.getFullYear(), st.getMonth(), st.getDate(), hh, mm), [h2, m2] = (e.endTime || '').split(':').map(Number), b = e.endTime ? new Date(st.getFullYear(), st.getMonth(), st.getDate(), h2, m2) : new Date(a.getTime() + 36e5), f = x => `${ds(x)}T${pad(x.getHours())}${pad(x.getMinutes())}00`; L.push(`DTSTART:${f(a)}`, `DTEND:${f(b)}`); }
    else { const en = pd(e.end || e.date); en.setDate(en.getDate() + 1); L.push(`DTSTART;VALUE=DATE:${ds(st)}`, `DTEND;VALUE=DATE:${ds(en)}`); }
    if (e.repeat) L.push('RRULE:FREQ=' + e.repeat.toUpperCase() + ((e.interval || 1) > 1 ? ';INTERVAL=' + e.interval : '') + (e.until ? ';UNTIL=' + e.until.replace(/-/g, '') : ''));
    L.push(icsFold('SUMMARY:' + icsEsc(e.title))); if (e.note) L.push(icsFold('DESCRIPTION:' + icsEsc(e.note)));
    L.push('BEGIN:VALARM', 'ACTION:DISPLAY', icsFold('DESCRIPTION:' + icsEsc(e.title)), e.time ? 'TRIGGER:-PT15M' : 'TRIGGER:PT9H', 'END:VALARM', 'END:VEVENT');
  });
  if (withRules) D.rules.filter(r => r.active !== false && r.time && r.days.length).forEach(r => {
    const ds = x => `${x.getFullYear()}${pad(x.getMonth() + 1)}${pad(x.getDate())}`;
    const first = todayD(); for (let i = 0; i < 8 && !r.days.includes(first.getDay()); i++) first.setDate(first.getDate() + 1); // первый подходящий день
    const [hh, mm] = r.time.split(':').map(Number), st = new Date(first.getFullYear(), first.getMonth(), first.getDate(), hh, mm), en = new Date(st.getTime() + 10 * 6e4);
    const dt = x => `${ds(x)}T${pad(x.getHours())}${pad(x.getMinutes())}00`;
    L.push('BEGIN:VEVENT', `UID:${r.id}@moi-mir`, `DTSTAMP:${ds(t)}T000000Z`, `DTSTART:${dt(st)}`, `DTEND:${dt(en)}`,
      r.days.length === 7 ? 'RRULE:FREQ=DAILY' : 'RRULE:FREQ=WEEKLY;BYDAY=' + r.days.map(i => DOW_ICS[i]).join(','),
      icsFold('SUMMARY:' + icsEsc((r.emoji || '🌿') + ' ' + r.title + ((r.target || 1) > 1 ? ` (${r.target} ${r.unit || 'раз'})` : ''))));
    if (r.note) L.push(icsFold('DESCRIPTION:' + icsEsc(r.note)));
    L.push('BEGIN:VALARM', 'ACTION:DISPLAY', icsFold('DESCRIPTION:' + icsEsc(r.title)), 'TRIGGER:PT0S', 'END:VALARM', 'END:VEVENT');
  });
  L.push('END:VCALENDAR');
  return L.filter(Boolean).join('\r\n');
}

/* ---- события ---- */
document.addEventListener('click', e => {
  if (e.target.closest('#finRoot')) return; // внутри «Финансов» свои обработчики
  const el = e.target.closest('[data-act]'); if (!el) { if (e.target.id === 'home') { view = 'home'; render(); } return; }
  const id = el.dataset.id;
  switch (el.dataset.act) {
    case 'open': if ($('#dlg').open) $('#dlg').close(); view = el.dataset.v; tab = 'soon'; ttab = 'active'; rtab = 'today'; tripId = null; vday = iso(todayD()); render(); scrollTo(0, 0); break;
    case 'rtab': rtab = el.dataset.v; view = 'rules'; render(); break;
    case 'syncSetup': syncSetupDialog(); break;
    case 'syncNow': syncNow(syncStatus === 'auth'); break;
    case 'syncLogin': syncNow(true); break;
    case 'syncRestore': syncRestoreDialog(); break;
    case 'syncOff': if (confirm('Отключить синхронизацию на этом устройстве? Данные на устройстве останутся, а в Google Диске останется последняя загруженная копия.')) syncOff(); break;
    case 'unlock': { if (hash53($('#lk_pw').value) === D.lock.hash) { unlocked = true; render(); } else toast('Неверный пароль'); break; }
    case 'lockset': lockDialog(); break;
    case 'htab': htab = el.dataset.v; render(); break;
    case 'hrAdd': recDialog(el.dataset.t); break;
    case 'hrEdit': recDialog(el.dataset.t, hrec(el.dataset.t).find(x => x.id === id)); break;
    case 'hrDel': if (confirm('Удалить запись?')) { D.health[el.dataset.t] = D.health[el.dataset.t].filter(x => x.id !== id); persist(); render(); } break;
    case 'hrAgain': { const t = el.dataset.t, r = hrec(t).find(x => x.id === id); recDialog(t, null, {title: r.title, who: r.who, place: r.place, date: r.next}); break; }

const acct = id => S.accounts.find(a => a.id === id);
const cur = a => (a && a.currency) || 'RUB';
const rateOf = c => c === 'RUB' ? 1 : ((S.rates && S.rates[c]) || 0);
const loanOf = id => S.loans.find(l => l.id === id);

/** Считает остатки по журналу. upTo — включительно, skipId — не учитывать операцию (при правке). */
function compute(upTo, skipId) {
  const R = {bal: {}, debt: {}, paidP: {}, paidI: {}, last: {}, fl: {}, rc: {}};
  S.accounts.forEach(a => R.bal[a.id] = a.opening);
  Object.entries(S.openRc || {}).forEach(([p, v]) => R.rc[p] = v);
  S.loans.forEach(l => { R.debt[l.id] = l.opening; R.paidP[l.id] = 0; R.paidI[l.id] = 0; R.last[l.id] = S.startDate; });
  const add = (o, k, v) => o[k] = r2((o[k] || 0) + v);
  for (const op of sortedOps()) {
    if (op.id === skipId || (upTo && op.date > upTo)) continue;
    const m = op.amount;
    switch (op.type) {
      case 'expense': add(R.bal, op.acc, -m); break;
      case 'income': add(R.bal, op.acc, m); break;
      case 'transfer': add(R.bal, op.acc, -m); add(R.bal, op.acc2, op.amount2 != null ? op.amount2 : m); break;
      case 'loanpay': {
        add(R.bal, op.acc, -m);
        const p = r2(m - (op.interest || 0));
        add(R.debt, op.loan, -p); add(R.paidP, op.loan, p); add(R.paidI, op.loan, op.interest || 0);
        R.last[op.loan] = op.date; break;
      }
      case 'loanin':
        if ((R.debt[op.loan] || 0) <= 0) R.last[op.loan] = op.date;
        add(R.bal, op.acc, m); add(R.debt, op.loan, m); break;
      case 'fin': add(R.bal, op.acc, m); add(R.fl, op.person, m); break;
      case 'fout': add(R.bal, op.acc, -m); add(R.fl, op.person, -m); break;
      case 'lgive': add(R.bal, op.acc, -m); add(R.rc, op.person, m); break;
      case 'lback': add(R.bal, op.acc, m); add(R.rc, op.person, -m); break;
      case 'recon': add(R.bal, op.acc, m); break; // amount = расхождение
    }
  }
  return R;
}
/** Проценты за период с прошлого платежа: долг × ставка / 365 × дни */
function suggestInterest(loanId, date, skipId) {
  const l = loanOf(loanId); if (!l || !l.rate) return 0;
  const R = compute(date, skipId);
  const d = days(R.last[loanId], date);
  return d > 0 ? r2(Math.max(R.debt[loanId], 0) * l.rate / 100 / 365 * d) : 0;
}
/** Накопительные и брокерские счета: разница при обновлении стоимости — рыночная переоценка, а не потерянные деньги */
const isRevalAcc = a => !!a && isMine(a) && SAVING(a.type);
function revals() {
  return S.ops.filter(op => op.type === 'recon' && isRevalAcc(acct(op.acc))).map(op => ({d: op.date, a: r2(op.amount * rateOf(cur(acct(op.acc))))}));
}
/** Доходы и расходы как плоские записи (с процентами по кредитам и расхождениями сверки) */
function flows() {
  const out = [];
  for (const op of S.ops) {
    if (op.type === 'expense') out.push({d: op.date, k: 'e', c: op.cat, a: op.amount});
    else if (op.type === 'income') out.push({d: op.date, k: 'i', c: op.cat, a: op.amount});
    else if (op.type === 'loanpay' && op.interest > 0) out.push({d: op.date, k: 'e', c: LOAN_INT, a: op.interest});
    else if (op.type === 'recon' && isRevalAcc(acct(op.acc))) continue; // переоценка портфеля — не доход и не расход, см. revals()
    else if (op.type === 'recon') { // расхождение по валютному счёту пересчитываем в рубли по текущему курсу
      const v = r2(op.amount * rateOf(cur(acct(op.acc))));
      if (v < 0) out.push({d: op.date, k: 'e', c: RECON_LOSS, a: -v});
      else if (v > 0) out.push({d: op.date, k: 'i', c: RECON_GAIN, a: v});
    }
  }
  return out;
}
/** Контроль: по каждой валюте сумма остатков по счетам = стартовые + все потоки */
function integrity() {
  const R = compute();
  const sumBal = {}, exp = {};
  S.accounts.forEach(a => { const c = cur(a); sumBal[c] = r2((sumBal[c] || 0) + R.bal[a.id]); exp[c] = (exp[c] || 0) + a.opening; });
  for (const op of S.ops) {
    const m = op.amount, c = cur(acct(op.acc));
    if (['income', 'loanin', 'fin', 'lback', 'recon'].includes(op.type)) exp[c] += m;
    else if (['expense', 'loanpay', 'fout', 'lgive'].includes(op.type)) exp[c] -= m;
    else if (op.type === 'transfer') { exp[c] -= m; const c2 = cur(acct(op.acc2)); exp[c2] += op.amount2 != null ? op.amount2 : m; }
  }
  const ok = Object.keys(sumBal).every(c => Math.abs(sumBal[c] - r2(exp[c])) < 0.005);
  return {sumBal: sumBal.RUB || 0, expected: r2(exp.RUB || 0), ok};
}
function totals() {
  const R = compute();
  let cash = 0, sav = 0, foreignAcc = {}, debts = 0, noRate = false;
  const fx = {};
  for (const a of S.accounts) {
    const c = cur(a), k = rateOf(c), v = R.bal[a.id];
    if (c !== 'RUB') { fx[c] = fx[c] || {bal: 0}; fx[c].bal = r2(fx[c].bal + v); if (!k && Math.abs(v) > 0) noRate = true; }
    if (isMine(a)) { if (SAVING(a.type)) sav += v * k; else cash += v * k; }
    else foreignAcc[a.owner] = r2((foreignAcc[a.owner] || 0) + v * k);
  }
  Object.keys(fx).forEach(c => fx[c].rub = r2(fx[c].bal * rateOf(c)));
  const fl = Object.values(R.fl).reduce((s, v) => s + v, 0);
  const rc = Object.values(R.rc).reduce((s, v) => s + v, 0);
  debts = S.loans.reduce((s, l) => s + R.debt[l.id], 0);
  const net = r2(cash + sav - fl - debts + rc);
  // взаиморасчёты с людьми: >0 — человек должен мне, <0 — я должна человеку
  const nets = {};
  Object.keys({...R.rc, ...R.fl}).forEach(p => { const v = r2((R.rc[p] || 0) - (R.fl[p] || 0)); if (Math.abs(v) > 0.004) nets[p] = v; });
  const owed = r2(Object.values(nets).filter(v => v > 0).reduce((s, v) => s + v, 0));
  const owe = r2(-Object.values(nets).filter(v => v < 0).reduce((s, v) => s + v, 0));
  return {R, cash: r2(cash), sav: r2(sav), foreignAcc, fl: r2(fl), rc: r2(rc), debts: r2(debts), net, fx, noRate, nets, owed, owe};
}

function viewSpend() {
  const y = +SM.slice(0, 4), m = +SM.slice(5), dim = new Date(y, m, 0).getDate();

  const fl = flows().filter(x => x.k === 'e');

  const daily = (key, cats) => {

    fl.filter(x => x.d.startsWith(key) && (!cats || cats.includes(x.c))).forEach(x => { a[+x.d.slice(8)] = r2(a[+x.d.slice(8)] + x.a); });

  };
  const sumTo = a => r2(a.slice(1, upTo + 1).reduce((s, v) => s + v, 0));
  /** нарастающий итог по дням месяца key: массив [0..31] */
  const cumul = (key, cats) => { let s = 0; return daily(key, cats).map((v, i) => i ? (s = r2(s + v)) : 0); };
  const known = new Set(S.cats.exp.flatMap(g => g.items));
  const extra = [...new Set(fl.map(x => x.c))].filter(c => !known.has(c));
  const groups = [...S.cats.exp.map(g => ({g: g.g, items: g.items})), ...(extra.length ? [{g: 'Прочее (служебные)', items: extra}] : [])];
  const all = cumul(SM), dAll = daily(SM), total = sumTo(dAll);

  groups.forEach(g => {
    const gd = daily(SM, g.items), gt = sumTo(gd);

    const act = g.items.filter(c => sumTo(daily(SM, [c])));
    if (act.length === 1) { // в группе одна статья: одна строка вместо двух одинаковых

      return;
    }
    rows += `<tr class="grp"><td>${esc(g.g)}</td><td class="n">${nf.format(Math.round(gt))}</td><td class="n mute">${total ? Math.round(gt / total * 100) : 0}%</td></tr>`;
    rowsD += `<tr class="grp"><td class="sticky">${esc(g.g)}</td>${dayCells(gd)}</tr>`;
    g.items.forEach(c => {
      const cd = daily(SM, [c]), ct = sumTo(cd);

      rows += `<tr><td>&nbsp;&nbsp;&nbsp;${esc(c)}</td><td class="n">${nf.format(Math.round(ct))}</td><td class="n mute">${total ? Math.round(ct / total * 100) : 0}%</td></tr>`;
      rowsD += `<tr><td class="sticky">&nbsp;&nbsp;${esc(c)}</td>${dayCells(cd)}</tr>`;

  // график: нарастающий итог всех трат за выбранный месяц
  const W = 720, H = 220, L = 56, B = 26, T = 12, R = 12;

  const ticks = [0, .25, .5, .75, 1].map(f => `<line x1="${L}" x2="${W - R}" y1="${Y(maxV * f)}" y2="${Y(maxV * f)}" style="stroke:var(--line)"/><text x="${L - 6}" y="${Y(maxV * f) + 4}" text-anchor="end" font-size="11" style="fill:var(--mute)">${nf.format(Math.round(maxV * f / 1000))}к</text>`).join('');
  const xt = [1, 5, 10, 15, 20, 25, 30].filter(d => d <= dim).map(d => `<text x="${X(d)}" y="${H - 8}" text-anchor="middle" font-size="11" style="fill:var(--mute)">${d}</text>`).join('');
  const chart = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Нарастающий итог трат по дням">${ticks}${xt}
    <path d="${path(all, upTo)}" fill="none" stroke-width="3" style="stroke:var(--acc)"/>

  const months = [...new Set([today().slice(0, 7), ...S.ops.map(o => o.date.slice(0, 7))])].sort().reverse();
  const tdy = cur_ ? `на ${upTo}-е число` : 'за месяц';
  return `<div class="row" style="margin-bottom:12px"><h2 style="margin:0">Траты за месяц</h2>
    <select style="max-width:200px" data-sm="1">${months.map(k => `<option value="${k}" ${k === SM ? 'selected' : ''}>${monthLabel(k)}</option>`).join('')}</select></div>
  <div class="kpis">
    <div class="kpi"><span>Потрачено ${tdy}</span><b>${fmt(total)}</b></div>
  </div>
  <div class="card"><h2>Нарастающий итог всех трат по дням</h2>${chart}</div>
  <div class="card scroll"><h2>По статьям ${tdy}</h2><table><tr><th>Статья</th><th class="n">Потрачено</th><th class="n">Доля</th></tr>${rows || '<tr><td colspan="3" class="mute">В этом месяце расходов пока нет.</td></tr>'}<tr class="tot"><td>Всего</td><td class="n">${nf.format(Math.round(total))}</td><td></td></tr></table></div>
  <div class="card"><h2>Траты по дням, по статьям</h2><p class="mute" style="margin-top:0">В каждой клетке — сколько потрачено на статью именно в этот день. Справа — итог за месяц.</p>
  <div class="scroll"><table class="days"><tr><th class="sticky">Статья</th>${Array.from({length: dim}, (_, i) => `<th class="n">${i + 1}</th>`).join('')}<th class="n">Итого</th></tr>${rowsD}<tr class="tot"><td class="sticky">Всего</td>${dayCells(dAll)}</tr></table></div></div>
  <p class="mute">В расходы здесь входят только траты и проценты по кредитам. Переводы между своими счетами, вклады и тело кредита не учитываются.</p>`;

function saveForm() {

    const act = num(F.actual); if (isNaN(act)) return bad('Введите остаток из банка'); if (!F.acc) return bad('Выберите счёт');

  } else {
    if (!(amt > 0)) return bad('Введите сумму больше нуля');

    if (!F.acc) return bad('Выберите счёт');
    op.acc = F.acc;
    if (t === 'expense') { if (!F.cat) return bad('Выберите категорию'); op.cat = F.cat; }
